<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="c2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Deep Indigo Gradient -->
    <linearGradient id="c2_indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Electric Emerald Spark Gradient -->
    <linearGradient id="c2_spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="c2_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>

    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c2_bg)" stroke="#E2E8F0" stroke-width="2.5" filter="url(#c2_shadow)"/>

  <!-- Minimalist Geometric "G" Body (Bold & Crisp) -->
  <path d="M 372 168
           C 340 120, 296 96, 246 96
           C 158 96, 88 166, 88 256
           C 88 346, 158 416, 246 416
           C 330 416, 396 352, 404 270
           C 406 256, 394 244, 380 244
           L 260 244
           C 246 244, 236 254, 236 268
           L 236 276
           C 236 286, 244 294, 254 294
           L 348 294
           C 334 340, 294 366, 246 366
           C 184 366, 138 318, 138 256
           C 138 194, 184 146, 246 146
           C 284 146, 316 164, 336 194
           C 344 206, 360 208, 370 200
           L 374 196
           C 382 188, 380 176, 372 168 Z"
        fill="url(#c2_indigo)"/>

  <!-- Iconic 4-Point AI Sparkle in Center Crossbar -->
  <path d="M 310 170
           C 310 205, 345 205, 345 205
           C 345 205, 310 205, 310 240
           C 310 205, 275 205, 275 205
           C 275 205, 310 205, 310 170 Z"
        fill="url(#c2_spark)"
        filter="url(#sparkGlow)"/>

  <!-- Floating Micro AI Node -->
  <circle cx="368" cy="144" r="8" fill="#10B981"/>
</svg>
