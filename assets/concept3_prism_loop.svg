<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Band 1: Electric Blue to Indigo -->
    <linearGradient id="band1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Band 2: Emerald to Mint -->
    <linearGradient id="band2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="c3_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#c3_bg)" stroke="#E2E8F0" stroke-width="2.5" filter="url(#c3_shadow)"/>

  <!-- Upper Arch (Indigo) -->
  <path d="M 370 180
           C 340 120, 280 90, 220 100
           C 140 115, 90 190, 95 270
           C 100 350, 160 410, 240 415
           C 300 420, 360 380, 385 320
           L 335 295
           C 315 340, 275 365, 235 360
           C 180 355, 145 310, 140 255
           C 135 200, 170 155, 225 150
           C 265 145, 305 165, 325 200
           L 370 180 Z"
        fill="url(#band1)"/>

  <!-- Interlocking G Core & Bar (Emerald) -->
  <path d="M 230 230
           L 390 230
           C 405 230, 415 242, 415 256
           L 415 310
           C 415 325, 402 338, 388 338
           L 350 338
           L 350 280
           L 260 280
           C 246 280, 235 268, 235 255
           L 235 235
           C 235 232, 232 230, 230 230 Z"
        fill="url(#band2)"/>

  <!-- Intersection Accent Glow Node -->
  <circle cx="230" cy="255" r="10" fill="#38BDF8"/>
  <circle cx="390" cy="256" r="12" fill="#10B981"/>
</svg>
